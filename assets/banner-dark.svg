<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Artem Protasov — building AI tools for filmmaking">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="0.55" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#0e1430"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c6fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4c6fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4c6fff" stop-opacity="0">
      </stop>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c6fff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#4c6fff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4c6fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- film strip: top and bottom sprocket holes -->
  <g fill="#ffffff" opacity="0.10">
    <g id="sprockets-top">
      <rect x="24"  y="18" width="26" height="16" rx="4"/><rect x="88"  y="18" width="26" height="16" rx="4"/>
      <rect x="152" y="18" width="26" height="16" rx="4"/><rect x="216" y="18" width="26" height="16" rx="4"/>
      <rect x="280" y="18" width="26" height="16" rx="4"/><rect x="344" y="18" width="26" height="16" rx="4"/>
      <rect x="408" y="18" width="26" height="16" rx="4"/><rect x="472" y="18" width="26" height="16" rx="4"/>
      <rect x="536" y="18" width="26" height="16" rx="4"/><rect x="600" y="18" width="26" height="16" rx="4"/>
      <rect x="664" y="18" width="26" height="16" rx="4"/><rect x="728" y="18" width="26" height="16" rx="4"/>
      <rect x="792" y="18" width="26" height="16" rx="4"/><rect x="856" y="18" width="26" height="16" rx="4"/>
      <rect x="920" y="18" width="26" height="16" rx="4"/><rect x="984" y="18" width="26" height="16" rx="4"/>
      <rect x="1048" y="18" width="26" height="16" rx="4"/><rect x="1112" y="18" width="26" height="16" rx="4"/>
      <rect x="1176" y="18" width="26" height="16" rx="4"/><rect x="1240" y="18" width="26" height="16" rx="4"/>
    </g>
    <use href="#sprockets-top" y="268"/>
  </g>

  <!-- faint frame outlines on the right -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2">
    <rect x="880"  y="76" width="150" height="96" rx="8"/>
    <rect x="1046" y="76" width="150" height="96" rx="8"/>
    <rect x="880"  y="188" width="150" height="96" rx="8"/>
    <rect x="1046" y="188" width="150" height="96" rx="8"/>
  </g>
  <!-- one "lit" frame -->
  <rect x="1046" y="76" width="150" height="96" rx="8" fill="none" stroke="url(#accent)" stroke-opacity="0.85" stroke-width="2"/>
  <g stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round">
    <path d="M1070 150 L1096 112 L1118 138 L1136 118 L1172 150" fill="none"/>
  </g>
  <circle cx="1160" cy="98" r="7" fill="#4c6fff" opacity="0.7"/>

  <!-- moving light beam -->
  <rect x="0" y="150" width="1280" height="2" fill="url(#beam)"/>

  <!-- text block -->
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="104" font-size="15" letter-spacing="6" fill="#8b95b5" font-weight="600">HEAD OF AI · AI ARCHITECT · FOUNDER</text>
    <text x="62" y="162" font-size="52" fill="#f4f6fb" font-weight="800" letter-spacing="0.5">Artem Protasov</text>
    <text x="64" y="204" font-size="21" fill="#aeb8d6" font-weight="500">Engineer&#8217;s depth, founder&#8217;s instinct.</text>
    <text x="64" y="234" font-size="21" fill="#aeb8d6" font-weight="500">Most AI stops at the demo &#8212; I ship what doesn&#8217;t.</text>
    <rect x="64" y="258" width="120" height="4" rx="2" fill="url(#accent)"/>
  </g>
</svg>
